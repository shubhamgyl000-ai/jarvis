<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mahi JARVIS</title>
<style>body{margin:0;background:#05070b;color:#eaf2ff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(680px,90vw);padding:40px;border:1px solid #1d2a3d;border-radius:24px;background:#0b1018;box-shadow:0 20px 70px #000}.orb{width:150px;height:150px;border-radius:50%;margin:0 auto 28px;background:radial-gradient(circle,#fff 0 3%,#63d9ff 12%,#1753ff 40%,#071027 70%);box-shadow:0 0 55px #168cff;animation:pulse 2.2s infinite}h1{text-align:center;font-size:42px;margin:0}.status{text-align:center;color:#8fa4bd;margin:12px 0 28px}.buttons{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}button{background:#152236;color:white;border:1px solid #2c496c;border-radius:12px;padding:13px 20px;cursor:pointer}button:hover{background:#1c3450}.note{text-align:center;color:#73869d;font-size:13px;margin-top:28px}@keyframes pulse{50%{transform:scale(1.05);box-shadow:0 0 90px #168cff}}</style></head>
<body><main class="card"><div class="orb"></div><h1>MAHI JARVIS</h1><div class="status" id="status">Browser voice mode — ready</div><div class="buttons"><button onclick="start()">🎙 Start Listening</button><button onclick="speak('Hello! I am Mahi. How can I help you?')">🔊 Test Voice</button></div><p class="note">For full laptop control, run <b>jarvis_pro.py</b> locally. A hosted webpage cannot directly control your operating system.</p></main>
<script>
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec;
function speak(t){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t));}
function start(){if(!SpeechRecognition){document.getElementById('status').textContent='Speech recognition is not supported in this browser.';return}rec=new SpeechRecognition();rec.lang='en-IN';rec.interimResults=false;rec.onstart=()=>document.getElementById('status').textContent='Listening...';rec.onresult=e=>handle(e.results[0][0].transcript);rec.onerror=()=>document.getElementById('status').textContent='Voice recognition error';rec.onend=()=>document.getElementById('status').textContent='Ready';rec.start();}
function handle(t){document.getElementById('status').textContent='Heard: '+t;let x=t.toLowerCase();if(x.startsWith('search ')){let q=t.slice(7);open('https://www.google.com/search?q='+encodeURIComponent(q));speak('Searching for '+q);return}if(x.includes('open youtube')){open('https://youtube.com');speak('Opening YouTube');return}if(x.includes('open spotify')){open('https://open.spotify.com');speak('Opening Spotify');return}if(x.startsWith('play ')){let q=t.slice(5);open('https://www.youtube.com/results?search_query='+encodeURIComponent(q));speak('Finding '+q);return}speak('I can search, open YouTube or Spotify, and find music in browser mode.');}
</script></body></html>
